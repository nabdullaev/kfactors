[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kfactors"
version = "0.1.0a1"
description = "Choose the number of factors in high-dimensional financial panels, and measure what the choice costs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Nursultan Abdullaev" },
  { name = "Kamilla Farzalieva" },
  { name = "Adel Bariev" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26,<2.5",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.3", "statsmodels>=0.14", "optht>=0.2"]

[project.scripts]
kfactors-bench = "kfactors.bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kfactors = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q here: the documented `pytest -q` must still print the "N passed" summary line.
addopts = "-m 'not network and not slow'"
markers = [
  "network: needs internet access (data downloads)",
  "slow: long-running (benchmarks, large simulations)",
]

[tool.coverage.run]
source = ["kfactors"]
omit = ["*/bench/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "RUF100"]
