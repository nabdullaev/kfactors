name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg          # plots are rendered off-screen
      KFACTORS_DATA: ${{ github.workspace }}/.kfactors-cache   # never touch ~/.cache
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install kfactors with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip list

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests with coverage (network and slow tests excluded)
        # pyproject.toml addopts already contains -m 'not network and not slow';
        # it is repeated here so the CI contract does not depend on that file.
        run: >
          python -m pytest -m "not network and not slow"
          --cov=kfactors --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  wheel:
    # The test job uses an editable install. This job checks the built wheel instead: it is
    # installed non-editably into a clean venv and the suite runs from a directory outside the
    # checkout, so a missing package-data file (e.g. resources/decision_table.json) fails here.
    name: wheel install (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      KFACTORS_DATA: ${{ github.workspace }}/.kfactors-cache
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl "pytest>=8" "statsmodels>=0.14" "optht>=0.2"

      - name: Run the tests against the installed wheel
        # tests/ read configs/, docs/ and a few top-level files relative to their own location,
        # so those are copied next to them; src/ is not copied, so kfactors comes from the wheel.
        run: |
          mkdir -p /tmp/wheel-tests
          cp -r tests configs docs LICENSE README.md CONTRIBUTING.md pyproject.toml /tmp/wheel-tests/
          cd /tmp/wheel-tests
          /tmp/wheel-venv/bin/python -c "import kfactors, sys; assert 'site-packages' in kfactors.__file__, kfactors.__file__"
          /tmp/wheel-venv/bin/python -m pytest -p no:cacheprovider -m "not network and not slow" -q
