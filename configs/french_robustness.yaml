name: french_robustness
seed: 42
n_jobs: 1

real:
  rules:
    - variance_share
    - kaiser
    - bai_ng
    - ahn_horenstein
    - onatski
    - parallel
    - mp
    - mp_market
    - gavish_donoho

  n_boot: 200
  alpha: 0.10

  walkforward:
    lag: 0
    standardize: true
    kmax: 20

  report:
    n_boot: 100
    kmax: 20

  rolling:
    step: 12
    kmax: 20

  spectrum:
    top: 50

  panels:
    - name: french_100_daily
      source: french
      args:
        dataset: 100_size_bm
        freq: daily
        weighting: vw
        start: "1963-07-01"

      walkforward:
        window: 252
        rebalance: 21
        cost_bps: 0
        min_assets: 50
        start: "1970-01-01"
        kmax: 20

      rolling:
        window: 252
        step: 21
        kmax: 20

      spectrum:
        window: 252
        top: 50

      experiments:
        - name: tangency_gamma_0
          strategy: kfactors.strategies.sdf:TangencyPCA
          strategy_kwargs:
            gamma: 0.0
          metric: sharpe_net
          k_grid: "0..20"

        - name: tangency_gamma_01
          strategy: kfactors.strategies.sdf:TangencyPCA
          strategy_kwargs:
            gamma: 0.1
          metric: sharpe_net
          k_grid: "0..20"

    - name: french_49_monthly
      source: french
      args:
        dataset: 49_industries
        freq: monthly
        weighting: vw
        start: "1971-01-01"

      walkforward:
        window: 120
        rebalance: 1
        cost_bps: 0
        min_assets: 20
        start: "1981-01-01"
        kmax: 20

      rolling:
        window: 120
        step: 12
        kmax: 20

      spectrum:
        window: 120
        top: 50

      experiments:
        - name: tangency_gamma_0
          strategy: kfactors.strategies.sdf:TangencyPCA
          strategy_kwargs:
            gamma: 0.0
          metric: sharpe_net
          k_grid: "0..20"

        - name: tangency_gamma_01
          strategy: kfactors.strategies.sdf:TangencyPCA
          strategy_kwargs:
            gamma: 0.1
          metric: sharpe_net
          k_grid: "0..20"